
name: Update Recent Merged PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Fetch merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/search/issues?q=is%3Apr%20is%3Amerged%20author%3AHsrRaza&per_page=10" \
            --jq '.items[] | "- [\(.title)](\(.html_url)) — `\(.repository_url | split("/")[-2:] | join("/"))`"' \
            > /tmp/merged-prs.md

          echo "Merged PR results:"
          cat /tmp/merged-prs.md


      - name: Update README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()

          start = "<!-- MERGED_PRS_START -->"
          end = "<!-- MERGED_PRS_END -->"

          prs = Path("/tmp/merged-prs.md").read_text().strip()

          if not prs:
              prs = "_No merged PRs found yet._"

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)

          updated = (
              before + start + "\n" +
              prs + "\n" + end + after
          )

          readme.write_text(updated)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update recent merged PRs"
            git push
          fi
